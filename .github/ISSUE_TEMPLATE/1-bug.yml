name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Describe what you saw. Paste any error message exactly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The URL, page, browser, or device where it happens.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
