name: Task
description: Work that is neither a bug nor a feature, such as an upgrade or cleanup.
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What needs doing, and why now?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know the task is finished.
    validations:
      required: true
